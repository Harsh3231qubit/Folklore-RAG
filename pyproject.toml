[project]
name = "folklore-rag"
version = "0.1.0"
description = "RAG + LangGraph story generation with LLM-as-judge evals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "langgraph", "qdrant-client", "sentence-transformers", "groq",
  "tenacity", "scipy", "pandas", "python-dotenv",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
